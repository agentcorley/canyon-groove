<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embed preview: Canyon Groove inside a host page</title>
<style>
  body { margin: 0; background: #F4EFE4; color: #1A1815; font-family: Inter, system-ui, sans-serif; }
  header, footer { padding: 1.4rem clamp(1rem,4vw,2.5rem); display: flex; justify-content: space-between; align-items: center; }
  header { border-bottom: 1px solid #1A1815; }
  footer { border-top: 1px solid #1A1815; font-size: .85rem; color: #6b6257; }
  .brand { font-weight: 700; letter-spacing: -.01em; }
  nav { display: flex; flex-wrap: wrap; gap: .3rem 1.2rem; }
  nav a { color: #1A1815; text-decoration: none; font-size: .9rem; }
</style>
</head>
<body>
<!-- Stand-in for the cumberlandcoast.com header. Local preview only. -->
<header><span class="brand">Cumberland Coast</span><nav><a href="#">Work</a><a href="#">Consulting</a><a href="#">Studio</a><a href="#">About</a><a href="#">Contact</a></nav></header>

<!-- This block is wordpress/embed.html with APP_HOST and PAGE_URL filled for local preview. -->
<div id="canyon-groove" style="background:#0a0a08;padding:0 clamp(1rem,4vw,2.5rem);overflow:hidden">
  <iframe id="cg-frame" title="Canyon Groove"
    src="../?embed=1&amp;canonical=http://localhost:8765/wordpress/preview.html"
    style="width:100%;height:1800px;border:0;display:block;background:#0a0a08"
    allow="autoplay; clipboard-write; web-share"
    loading="eager"></iframe>
</div>
<script>
(function () {
  var f = document.getElementById('cg-frame');
  if (!f) return;
  if (location.hash) f.src = f.src.split('#')[0] + location.hash;
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'cg-height' && d.h) f.style.height = (d.h + 24) + 'px';
    if (d.type === 'cg-hash' && typeof d.hash === 'string') { try { history.replaceState(null, '', d.hash || location.pathname); } catch (err) {} }
    if (d.type === 'cg-scroll' && typeof d.top === 'number') {
      var abs = f.getBoundingClientRect().top + window.pageYOffset + d.top, m = d.margin || 24;
      var vis = abs >= window.pageYOffset + m && abs + d.height <= window.pageYOffset + window.innerHeight - m;
      if (!vis) window.scrollTo({ top: Math.max(0, abs - m), behavior: 'smooth' });
    }
  });
})();
</script>

<footer><span>Cumberland Coast LLC, founded 2014 · Built in Atlanta</span><span>The Catalog · PersonalizeCX · JonathanCorley.com</span></footer>
</body>
</html>
