<!--
  Canyon Groove on cumberlandcoast.com
  Paste this whole block into a Custom HTML block on the page.
  Replace APP_HOST with the deployed origin, for example https://groove.cumberlandcoast.com or https://canyon-groove.vercel.app
  and PAGE_URL with the public URL of this WordPress page.
  The app hides its own footer inside the iframe (embed=1), so the page supplies yours.
  Share links made inside the app point at PAGE_URL, and the page URL follows the cut.
-->
<div id="canyon-groove" style="background:#0a0a08;margin:0 calc(50% - 50vw);padding:0 clamp(1rem,4vw,2.5rem)">
  <iframe id="cg-frame" title="Canyon Groove"
    src="APP_HOST/?embed=1&amp;canonical=PAGE_URL"
    style="width:100%;height:1800px;border:0;display:block;background:#0a0a08"
    allow="autoplay; clipboard-write; web-share"
    loading="eager"></iframe>
</div>
<script>
(function () {
  var f = document.getElementById('cg-frame');
  if (!f) return;
  if (location.hash) f.src = f.src.split('#')[0] + location.hash;
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'cg-height' && d.h) f.style.height = (d.h + 24) + 'px';
    if (d.type === 'cg-hash' && typeof d.hash === 'string') { try { history.replaceState(null, '', d.hash || location.pathname); } catch (err) {} }
    if (d.type === 'cg-scroll' && typeof d.top === 'number') {
      var abs = f.getBoundingClientRect().top + window.pageYOffset + d.top, m = d.margin || 24;
      var vis = abs >= window.pageYOffset + m && abs + d.height <= window.pageYOffset + window.innerHeight - m;
      if (!vis) window.scrollTo({ top: Math.max(0, abs - m), behavior: 'smooth' });
    }
  });
})();
</script>
